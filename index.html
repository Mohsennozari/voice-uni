<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ضبط صدا و یاداشت نویسی</title>
    <style>
        @import url('https://vfont.ir/css/Vazirmatn.css'); /* فونت وزیر متن */
        *{
        font-family: 'Vazirmatn', Arial, sans-serif;
        
        font-size: 20px;
        font-weight: 900;
        border-radius:10px;
        
        }
        body {
            font-family: 'Vazirmatn', Arial, sans-serif; /* استفاده از فونت وزیر متن */
            text-align: center;
            margin: 20px;
        font-family: 'Vazirmatn', Arial, sans-serif; /* استفاده از فونت وزیر متن */
        text-align: center;
        margin: 20px;
        color: #000000;
        background-color: #000000;
      }
        
        body {
            font-family: 'Vazirmatn', Arial, sans-serif; /* استفاده از فونت وزیر متن */
            text-align: center;
            margin: 20px;
            color: #000000;
            background-color: #000000;
        }
        .box {
            border: 1px solid #000000;
            padding: 20px;
            margin: 30px auto;
            width: 300px;
            border-radius: 5px;
            background-color: #000000;
            position: relative;
            box-shadow:#ff9900 0 0 10px;
            font-family: 'Vazirmatn', Arial, sans-serif;
        }
        .box h2 {
            margin-bottom: 10px;
        }
        .box button {
            margin: 5px;
            padding: 5px 10px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Vazirmatn', Arial, sans-serif; /* فونت دکمه‌ها */
            font-family: 'Vazirmatn', Arial, sans-serif;
        }
        .box input[type="text"], .box textarea {
            padding: 5px;
            font-size: 14px;
            width: 100%;
            margin-bottom: 10px;
            font-family: 'Vazirmatn', Arial, sans-serif; /* فونت ورودی‌ها */
            font-family: 'Vazirmatn', Arial, sans-serif;
            background-color: #000000;
            box-shadow: #ff9900 0 0 10px;
            border: #000000 1px solid #000000; 
            
        }
        .box audio {
            width: 100%;
            margin-top: 10px;
            font-family: 'Vazirmatn', Arial, sans-serif;
        }
        .recording-info {
            display: none;
            margin-top: 10px;
            font-family: 'Vazirmatn', Arial, sans-serif;
        }
        .notes {
            margin-top: 10px;
            font-family: 'Vazirmatn', Arial, sans-serif;
        }
        .edit-title {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 12px;
            background: #000000;
            box-shadow: #ff9900 0 0 4px;
            color: white;
            border: none;
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 5px;
            font-family: 'Vazirmatn', Arial, sans-serif; /* فونت دکمه ویرایش */
        }
        .saved-notes {
            margin-top: 10px;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid #000000;
            padding: 10px;
            background: #2a5f63;
            font-family: 'Vazirmatn', Arial, sans-serif;
        }
        .note-item {
            margin-bottom: 5px;
            padding: 5px;
            background: #fa8b8b;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            font-family: 'Vazirmatn', Arial, sans-serif; /* فونت یادداشت‌ها */
        }
        .note-item:hover {
            background: #d0d0d0;
        }
        .note-title {
            font-weight: bold;
        }
        .note-content {
            display: none;
            margin-top: 5px;
        }
        .save-pdf-button {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 12px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 3px;
            font-family: 'Vazirmatn', Arial, sans-serif; /* فونت دکمه PDF */
        }
    </style>
</head>
<body>
    <h1>برنامه ضبط صدا و یاداشت نویسی</h1>

    <!-- تعریف ده باکس -->
    <div id="boxesContainer"></div>

    <script>
        // تابع برای ایجاد PDF
        function createPDF(noteTitle, noteContent, boxTitle) {
            const { jsPDF } = window.jspdf;

            // ایجاد شی PDF
            const pdf = new jsPDF();

            // اضافه کردن متن یاداشت به PDF
            pdf.text("عنوان باکس:", 10, 10);
            pdf.text(boxTitle, 10, 20);
            pdf.text("عنوان یادداشت:", 10, 30);
            pdf.text(noteTitle, 10, 40);
            pdf.text("متن یادداشت:", 10, 50);
            pdf.text(noteContent, 10, 60);

            // ذخیره PDF
            const pdfBlob = pdf.output('blob');
            const a = document.createElement('a');
            a.href = URL.createObjectURL(pdfBlob);
            const now = new Date().toISOString().replace(/[:.]/g, '-');
            a.download = `${boxTitle}_${now}_note.pdf`;
            a.click();
        }

        // تابع برای ایجاد یک باکس جدید
        function createBox(title) {
            const box = document.createElement('div');
            box.classList.add('box');

            const heading = document.createElement('h2');
            heading.textContent = title;
            heading.contentEditable = false;

            const editTitleButton = document.createElement('button');
            editTitleButton.textContent = 'ویرایش';
            editTitleButton.classList.add('edit-title');
            editTitleButton.onclick = () => {
                if (!heading.contentEditable) {
                    heading.contentEditable = true;
                    heading.focus(); // فوکوس روی عنوان
                } else {
                    heading.contentEditable = false;
                    heading.blur(); // حذف فوکوس از عنوان
                }
            };

            const startButton = document.createElement('button');
            startButton.textContent = 'شروع ضبط';

            const stopButton = document.createElement('button');
            stopButton.textContent = 'متوقف کردن';
            stopButton.disabled = true;

            const fileNameInput = document.createElement('input');
            fileNameInput.type = 'text';
            fileNameInput.placeholder = 'نام فایل را وارد کنید';

            const saveButton = document.createElement('button');
            saveButton.textContent = 'ذخیره به PDF';
            saveButton.disabled = true;

            const notesLabel = document.createElement('label');
            notesLabel.textContent = 'یاداشت:';

            const notesTextarea = document.createElement('textarea');
            notesTextarea.rows = 4;
            notesTextarea.placeholder = 'یاداشت خود را اینجا بنویسید...';

            const addNoteButton = document.createElement('button');
            addNoteButton.textContent = 'افزودن یادداشت';
            addNoteButton.onclick = () => {
                const noteTitle = prompt('عنوان یادداشت را وارد کنید:');
                const noteContent = notesTextarea.value.trim();
                if (noteTitle && noteContent) {
                    const noteItem = document.createElement('div');
                    noteItem.classList.add('note-item');

                    const noteTitleElement = document.createElement('span');
                    noteTitleElement.classList.add('note-title');
                    noteTitleElement.textContent = noteTitle;

                    const savePdfButton = document.createElement('button');
                    savePdfButton.classList.add('save-pdf-button');
                    savePdfButton.textContent = 'PDF';
                    savePdfButton.onclick = () => {
                        createPDF(noteTitle, noteContent, heading.textContent);
                    };

                    const noteContentElement = document.createElement('div');
                    noteContentElement.classList.add('note-content');
                    noteContentElement.textContent = noteContent;

                    noteItem.appendChild(noteTitleElement);
                    noteItem.appendChild(savePdfButton);
                    noteItem.appendChild(noteContentElement);

                    noteItem.onclick = () => {
                        noteContentElement.style.display =
                            noteContentElement.style.display === 'block' ? 'none' : 'block';
                    };

                    savedNotesDiv.appendChild(noteItem);
                    notesTextarea.value = ''; // پاک کردن متن یادداشت بعد از افزودن
                } else {
                    alert('لطفاً عنوان و متن یادداشت خود را وارد کنید.');
                }
            };

            const recordingInfo = document.createElement('div');
            recordingInfo.classList.add('recording-info');

            const savedNotesDiv = document.createElement('div');
            savedNotesDiv.classList.add('saved-notes');

            box.appendChild(heading);
            box.appendChild(editTitleButton);
            box.appendChild(startButton);
            box.appendChild(stopButton);
            box.appendChild(fileNameInput);
            box.appendChild(saveButton);
            box.appendChild(notesLabel);
            box.appendChild(notesTextarea);
            box.appendChild(addNoteButton);
            box.appendChild(recordingInfo);
            box.appendChild(savedNotesDiv);

            let mediaRecorder;
            let audioChunks = [];

            startButton.onclick = async () => {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });

                    const audioElement = document.createElement('audio');
                    audioElement.controls = true;
                    audioElement.src = URL.createObjectURL(audioBlob);

                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'حذف';
                    deleteButton.onclick = () => {
                        URL.revokeObjectURL(audioElement.src);
                        recordingInfo.innerHTML = '';
                    };

                    const downloadButton = document.createElement('button');
                    downloadButton.textContent = 'دانلود';
                    downloadButton.onclick = () => {
                        const now = new Date().toISOString().replace(/[:.]/g, '-');
                        const a = document.createElement('a');
                        a.href = audioElement.src;
                        a.download = `${heading.textContent}_${now}.wav`;
                        a.click();
                    };

                    const noteDisplay = document.createElement('p');
                    noteDisplay.textContent = `یاداشت: ${notesTextarea.value || 'بدون یاداشت'}`;

                    recordingInfo.innerHTML = '';
                    recordingInfo.appendChild(audioElement);
                    recordingInfo.appendChild(deleteButton);
                    recordingInfo.appendChild(downloadButton);
                    recordingInfo.appendChild(noteDisplay);
                    recordingInfo.style.display = 'block';

                    saveButton.disabled = false; // فعال کردن دکمه ذخیره PDF
                };

                mediaRecorder.start();
                startButton.disabled = true;
                stopButton.disabled = false;
            };

            stopButton.onclick = () => {
                if (mediaRecorder) mediaRecorder.stop();
                startButton.disabled = false;
                stopButton.disabled = true;
            };

            saveButton.onclick = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                const notes = notesTextarea.value;
                const fileName = fileNameInput.value || 'ثبت_صدا';
                createPDF(fileName, notes, heading.textContent);
            };

            return box;
        }

        // ایجاد ده باکس با عنوان متفاوت
        const titles = [
            'شیمی آلی', 'زیست‌شناسی', 'فیزیک', 'ریاضیات', 'آمار',
            'حسابان', 'جبر', 'علوم اجتماعی', 'تاریخ', 'فلسفه'
        ];

        const boxesContainer = document.getElementById('boxesContainer');
        titles.forEach(title => {
            const box = createBox(title);
            boxesContainer.appendChild(box);
        });

        // بارگذاری jspdf
        const script = document.createElement('script');
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
        document.body.appendChild(script);
    </script>
</body>
</html>
