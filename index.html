
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نرم‌افزار ضبط صدا پیشرفته</title>
    <link href="https://cdn.jsdelivr.net/npm/@vidstack/player@latest/styles/base.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --background-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--background-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--primary-color), #2980b9);
            color: white;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .record-btn {
            background-color: var(--success-color);
            color: white;
        }

        .stop-btn {
            background-color: var(--danger-color);
            color: white;
        }

        .play-btn {
            background-color: var(--primary-color);
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #ddd;
            border-radius: 5px;
            margin: 1rem 0;
        }

        .progress {
            height: 100%;
            background-color: var(--primary-color);
            border-radius: 5px;
            transition: width 0.3s ease;
        }

        .timer {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin: 1rem 0;
            color: #2c3e50;
        }

        .boxes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .box {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
            position: relative;
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .box-title {
            margin: 0;
            font-size: 1.2rem;
            color: #34495e;
            cursor: pointer;
        }

        .color-picker {
            width: 30px;
            height: 30px;
            border: none;
            cursor: pointer;
            padding: 0;
        }

        .file-list {
            margin-top: 1rem;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .sort-options {
            margin: 1rem 0;
            display: flex;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .boxes {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📻 نرم‌افزار ضبط صدا پیشرفته</h1>
            <p>ضبط و مدیریت فایل‌های صوتی دروس</p>
        </header>

        <div class="controls">
            <button class="record-btn" id="start-recording">⏺ شروع ضبط</button>
            <button class="stop-btn" id="stop-recording" disabled>⏹ توقف ضبط</button>
            <div class="timer" id="timer">00:00:00</div>
        </div>
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div class="sort-options">
            <button onclick="sortFiles('date')">مرتب‌سازی بر اساس تاریخ</button>
            <button onclick="sortFiles('name')">مرتب‌سازی بر اساس نام</button>
        </div>

        <button class="record-btn" onclick="addNewLesson()" style="margin: 1rem 0">➕ افزودن درس جدید</button>

        <div class="boxes" id="boxes-container"></div>

        <!-- Modals -->
        <div class="modal" id="edit-modal">
            <div class="modal-content">
                <h3>ویرایش نام درس</h3>
                <input type="text" id="lesson-name" class="form-input">
                <div class="modal-actions">
                    <button onclick="saveLessonName()">💾 ذخیره</button>
                    <button onclick="closeModal()">❌ لغو</button>
                </div>
            </div>
        </div>

        <div class="modal" id="help-modal">
            <div class="modal-content">
                <h3>راهنمای استفاده</h3>
                <p>1. برای شروع ضبط روی دکمه قرمز کلیک کنید</p>
                <p>2. برای توقف از دکمه توقف استفاده کنید</p>
                <p>3. با کلیک روی نام درس می‌توانید آن را ویرایش کنید</p>
                <button onclick="closeModal()">بستن</button>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let currentLesson = null;
        let lessons = JSON.parse(localStorage.getItem('lessons')) || [];
        let timerInterval;
        let startTime;

        // Initialize if empty
        if (lessons.length === 0) {
            lessons = Array.from({length: 10}, (_, i) => ({
                id: Date.now() + i,
                name: `درس ${i + 1}`,
                color: '#ffffff',
                files: [],
                created: Date.now()
            }));
            localStorage.setItem('lessons', JSON.stringify(lessons));
        }

        // Render lessons
        function renderLessons() {
            const container = document.getElementById('boxes-container');
            container.innerHTML = lessons.map(lesson => `
                <div class="box" data-id="${lesson.id}" style="background:${lesson.color}">
                    <div class="box-header">
                        <h3 class="box-title" ondblclick="openEditModal(${lesson.id})">${lesson.name}</h3>
                        <div class="box-controls">
                            <input type="color" class="color-picker" 
                                   value="${lesson.color}" 
                                   onchange="updateLessonColor(${lesson.id}, this.value)">
                            <button class="delete-btn" onclick="deleteLesson(${lesson.id})">🗑️</button>
                        </div>
                    </div>
                    <div class="file-list">
                        ${lesson.files.map((file, index) => `
                            <div class="file-item">
                                <span ondblclick="editFileName(${lesson.id}, ${index})">${file.name}</span>
                                <div>
                                    <span style="font-size:0.8rem">${file.date}</span>
                                    <button onclick="playRecording('${file.url}')">▶️</button>
                                    <button onclick="deleteFile(${lesson.id}, ${index})">🗑️</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="record-btn" onclick="startRecording(${lesson.id})" style="margin-top:1rem">
                        ضبط جدید
                    </button>
                    <input type="file" accept="audio/*" 
                           style="margin-top:0.5rem" 
                           onchange="uploadFile(${lesson.id}, this)">
                </div>
            `).join('');
        }

        // Recording functions
        async function startRecording(lessonId) {
            try {
                currentLesson = lessonId;
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const duration = Math.floor((Date.now() - startTime) / 1000);
                    
                    const lesson = lessons.find(l => l.id === currentLesson);
                    lesson.files.push({
                        name: `ضبط ${lesson.files.length + 1}`,
                        url: audioUrl,
                        date: new Date().toLocaleString(),
                        duration: duration
                    });
                    
                    localStorage.setItem('lessons', JSON.stringify(lessons));
                    renderLessons();
                    
                    audioChunks = [];
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                startTimer();
                updateControls(true);
            } catch (err) {
                alert('دسترسی به میکروفن مجاز نیست!');
            }
        }

        // File management
        function editFileName(lessonId, fileIndex) {
            const lesson = lessons.find(l => l.id === lessonId);
            const newName = prompt('نام جدید فایل را وارد کنید:', lesson.files[fileIndex].name);
            if (newName) {
                lesson.files[fileIndex].name = newName;
                localStorage.setItem('lessons', JSON.stringify(lessons));
                renderLessons();
            }
        }

        function sortFiles(mode) {
            lessons.forEach(lesson => {
                lesson.files.sort((a, b) => {
                    if (mode === 'date') return new Date(b.date) - new Date(a.date);
                    if (mode === 'name') return a.name.localeCompare(b.name);
                    return 0;
                });
            });
            localStorage.setItem('lessons', JSON.stringify(lessons));
            renderLessons();
        }

        // Lesson management
        function addNewLesson() {
            const newLesson = {
                id: Date.now(),
                name: `درس جدید ${lessons.length + 1}`,
                color: '#ffffff',
                files: [],
                created: Date.now()
            };
            lessons.push(newLesson);
            localStorage.setItem('lessons', JSON.stringify(lessons));
            renderLessons();
        }

        function updateLessonColor(lessonId, color) {
            const lesson = lessons.find(l => l.id === lessonId);
            lesson.color = color;
            localStorage.setItem('lessons', JSON.stringify(lessons));
            renderLessons();
        }

        // Additional features
        function uploadFile(lessonId, input) {
            const file = input.files[0];
            if (file) {
                const lesson = lessons.find(l => l.id === lessonId);
                lesson.files.push({
                    name: file.name,
                    url: URL.createObjectURL(file),
                    date: new Date().toLocaleString(),
                    duration: 0
                });
                localStorage.setItem('lessons', JSON.stringify(lessons));
                renderLessons();
            }
        }

        function showHelp() {
            document.getElementById('help-modal').style.display = 'flex';
        }

        // Initialization
        document.getElementById('stop-recording').addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                updateControls(false);
                stopTimer();
            }
        });

        renderLessons();
    </script>
</body>
</html>
